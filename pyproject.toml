[project]
name = "rag-workbench"
version = "0.1.0"
description = "Local-first RAG retrieval engineering laboratory (ingestion, BM25, dense and hybrid retrieval)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "RAG Workbench" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    "streamlit>=1.37",
    "qdrant-client>=1.9",
    "httpx>=0.27",
]

# Dense retrieval extra. Optional so BM25 and the core test suite install and run
# without pulling a deep-learning stack or any model weights.
[project.optional-dependencies]
dense = [
    "sentence-transformers>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[project.scripts]
rag-workbench = "rag_workbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_workbench"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "benchmarks/outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["rag_workbench", "local_backend"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom uses function calls in argument defaults.
"src/rag_workbench/api/**" = ["B008"]
"ui/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not dense and not reranker and not ollama'"
markers = [
    "dense: needs the optional 'dense' extra and downloads a Sentence Transformers model; run with: uv run pytest -m dense",
    "reranker: needs the optional 'dense' extra and downloads the cross-encoder model; run with: uv run pytest -m reranker",
    "ollama: needs a running local Ollama with a pulled model; run with: uv run pytest -m ollama",
]
filterwarnings = ["ignore::DeprecationWarning"]
